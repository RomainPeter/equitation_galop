function testSetup(pre=null){stop();state=null;const selected=pre||DATA.chapters.filter(c=>c.level==='g1').map(c=>c.id);$('app').innerHTML=`<span class="eyebrow">Tests autonomes</span><h1>Que veux-tu tester ?</h1><section class="card glass"><p>Choisis un ou plusieurs chapitres. Tu n’as pas besoin de refaire les leçons.</p>${listen()}<div class="filter"><button class="small" onclick="setChecks('g1')">Tout le parcours G1</button><button class="small" onclick="setChecks('bonus')">Tous les bonus</button><button class="small" onclick="setChecks('none')">Tout décocher</button></div>${DATA.chapters.map(c=>`<div class="listrow"><label class="toggle"><input class="chtest" type="checkbox" data-ch="${c.id}" ${selected.includes(c.id)?'checked':''}><span>${esc(c.title)} ${c.level==='bonus'?'<span class="tag">Bonus</span>':''}</span></label></div>`).join('')}<p><label>Longueur de la séance <select id="testCount"><option value="10">10 questions</option><option value="5">5 questions</option><option value="20">20 questions</option><option value="all">Toutes les notions sélectionnées</option></select></label></p><p class="notice">Pour couvrir les 15 chapitres G1 en une seule séance, choisis au moins 20 questions. Un test de 5 ou 10 questions reste un échantillon. Une série complète est longue : tu peux préférer plusieurs tests par chapitre.</p><button class="primary wide" onclick="launchTest()">Commencer mon test</button></section>`;guide('Choisis les chapitres que tu veux tester en touchant leurs cases. Puis appuie sur « Commencer mon test ». Tu peux demander à un adulte de préparer la sélection.')}
function setChecks(level){document.querySelectorAll('.chtest').forEach(e=>e.checked=chBy[e.dataset.ch].level===level)}
function launchTest(){const ids=[...document.querySelectorAll('.chtest:checked')].map(e=>e.dataset.ch);if(!ids.length){say('Choisis au moins un chapitre avant de commencer.');alert('Choisis au moins un chapitre.');return}const all=ids.flatMap(id=>shuffle(DATA.cards.filter(c=>c.ch===id)));let count=$('testCount').value==='all'?all.length:Math.min(Number($('testCount').value),all.length);let buckets=shuffle(ids).map(id=>shuffle(all.filter(c=>c.ch===id))),balanced=[];while(balanced.length<count){let added=false;for(const b of buckets){if(b.length&&balanced.length<count){balanced.push(b.pop());added=true}}if(!added)break}start('test',ids,balanced)}
function library(){stop();state=null;$('app').innerHTML=`<h1>Une notion à retrouver ?</h1><input type="search" id="search" placeholder="Chercher : foin, garrot, casque…" oninput="searchLibrary()"><p class="muted">Accès direct à toutes les leçons. Le niveau est indiqué sur chaque résultat.</p><div id="searchResults" class="chapters"></div>`;searchLibrary();guide('Tu peux demander à un adulte de rechercher un mot. Appuie ensuite sur une leçon pour l’ouvrir.')}
function searchLibrary(){const term=$('search').value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const list=DATA.cards.filter(c=>(c.title+' '+c.text).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(term));$('searchResults').innerHTML=list.map(c=>`<button class="chapter glass" onclick="startOne('${c.id}')"><span class="body"><strong>${esc(c.title)}</strong><small>${esc(chBy[c.ch].title)} · ${c.level==='bonus'?'Bonus':'G1'} · ${label(c.id)}</small></span><span>›</span></button>`).join('')||'<p>Aucune notion trouvée.</p>'}
function parent(){stop();state=null;$('app').innerHTML=`<span class="eyebrow">Espace adulte</span><h1>Accompagner, sans presser.</h1><section class="card glass"><h2>La voix</h2><label class="toggle"><input type="checkbox" ${prefs.auto?'checked':''} onchange="prefs.auto=this.checked;save()">Guidage vocal automatique</label><p><label>Débit <select onchange="prefs.rate=Number(this.value);save()">${[.65,.75,.82,.9,1].map(v=>`<option value="${v}" ${prefs.rate===v?'selected':''}>${v===.65?'Très lent':v===.75?'Lent':v===.82?'Modéré':v===.9?'Modéré +':'Normal'}</option>`).join('')}</select></label></p><p><label>Voix française <select id="voiceSelect" onchange="prefs.voice=this.value;save()"></select></label></p><button class="wide" onclick="say('Bonjour ! Appuie sur « À moi de trouver ». Puis trouve les naseaux du cheval sur le dessin.')">Écouter la voix choisie</button><p class="muted">Voix du navigateur, pas de modèle premium intégré. « Locale » ne signifie pas que le téléchargement de la langue est déjà effectué : vérifie en mode avion. Aucun microphone utilisé.</p><div id="voiceInfo" class="muted"></div></section><section class="card glass"><h2>Suivi par chapitre</h2><p class="muted">Vues = leçons ouvertes, pas preuve qu’elles ont été lues. Réussites récentes = dernière réponse correcte en entraînement ou test.</p>${DATA.chapters.map(c=>{const s=chapterProgress(c.id);return `<div class="listrow"><div class="row"><span>${esc(c.title)}</span><span class="tag">${c.level==='bonus'?'Bonus':'G1'}</span></div><p class="muted">${s.seen} / ${s.total} vues · ${s.ok} / ${s.total} réussites récentes</p><button class="small" onclick="progressDetail('${c.id}')">Voir les notions</button></div>`}).join('')}</section><section class="card glass"><h2>Derniers tests terminés</h2>${prefs.history.length?prefs.history.slice(0,10).map(h=>`<div class="listrow"><strong>${h.score} / ${h.total}</strong> · ${new Date(h.date).toLocaleString('fr-FR')}<p class="muted">${h.chapters.map(id=>esc(chBy[id]?.title||id)).join(', ')}</p></div>`).join(''):'<p class="muted">Aucun test terminé pour l’instant.</p>'}</section><section class="card glass"><h2>Sauvegarde</h2><p class="muted">Les résultats restent dans ce navigateur. Un fichier local et un site hébergé peuvent avoir des sauvegardes distinctes. Exporte régulièrement. Cette version n’importe pas les statistiques de l’ancien chapitre car ses identifiants et son contenu ont changé.</p><div class="actions"><button onclick="exportData()">Exporter ma sauvegarde</button><button onclick="$('importFile').click()">Importer une sauvegarde de cette version</button><input id="importFile" hidden type="file" accept="application/json" onchange="importData(this.files[0])"><button onclick="if(confirm('Effacer les résultats, leçons vues, tests et suivi pratique ?')){prefs.stats={};prefs.seen={};prefs.history=[];prefs.skills={};save();parent()}">Effacer la progression</button></div><p id="notice" role="status"></p></section><div class="actions"><button onclick="skills()">Carnet des gestes au club</button><button onclick="sources()">Sources et limites</button><button onclick="home()">Accueil</button></div>`;populateVoices()}
function populateVoices(){if(!$('voiceSelect'))return;if(!('speechSynthesis'in window)){$('voiceSelect').innerHTML='<option>Lecture vocale indisponible</option>';return}voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('fr'));$('voiceSelect').innerHTML='<option value="">Choix automatique</option>'+voices.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===prefs.voice?'selected':''}>${esc(v.name)} · ${v.localService?'locale':'distante'}</option>`).join('');$('voiceInfo').textContent=voices.length?voices.length+' voix françaises détectées.':'Aucune voix française détectée pour l’instant. Vérifie les langues de synthèse installées sur la tablette.'}
if('speechSynthesis'in window)speechSynthesis.addEventListener('voiceschanged',populateVoices);
function progressDetail(ch){stop();state=null;$('app').innerHTML=`<h1>${esc(chBy[ch].title)}</h1><button class="small" onclick="parent()">Retour au suivi</button><section class="card glass" style="margin-top:18px">${DATA.cards.filter(c=>c.ch===ch).map(c=>{const s=stats(c.id);return `<div class="listrow"><strong>${esc(c.title)}</strong><p class="muted">${label(c.id)} · ${s.ok} réussites / ${s.n} réponses · ${s.dates.length} date(s) de réussite depuis la dernière erreur.</p><button class="small" onclick="startOne('${c.id}')">Revoir</button></div>`}).join('')}</section><p class="notice">Ces états sont des indicateurs propres à l’application. Ils ne constituent ni diagnostic de mémorisation ni certification.</p>`}
function skills(){stop();state=null;$('app').innerHTML=`<span class="eyebrow">Carnet parent et enseignant</span><h1>Les gestes se vivent au club.</h1><p class="notice">Ce carnet ne donne pas d’instructions pour tenter seul des manipulations. Il sert à préparer un échange avec l’enseignant. Cocher une case ne vaut pas validation officielle.</p>${[...new Set(DATA.skills.map(s=>s.group))].map(group=>`<section class="card glass"><h2>${esc(group)}</h2>${DATA.skills.filter(s=>s.group===group).map(s=>`<div class="listrow"><p>${esc(s.text)}</p><select aria-label="État : ${esc(s.text)}" onchange="prefs.skills['${s.id}']=this.value;save()">${['À découvrir','Montré au club','Pratiqué avec aide','Réalisé et vérifié au club'].map(v=>`<option ${prefs.skills[s.id]===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}</section>`).join('')}<button class="wide" onclick="home()">Retour à l’accueil</button>`;guide('Cette partie est pour ton parent et ton enseignant. Les gestes s’apprennent avec le cheval, au club.')}
function exportData(){const b=new Blob([JSON.stringify({format:'equi-complete-1',date:new Date().toISOString(),prefs},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='equi-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function importData(f){if(!f)return;try{const d=JSON.parse(await f.text());if(d.format!=='equi-complete-1'||!d.prefs||typeof d.prefs.stats!=='object')throw Error();let p=d.prefs,clean={...prefs,stats:{},seen:{},skills:{},history:[]};for(const c of DATA.cards){const s=p.stats[c.id];if(s&&Number.isInteger(s.n)&&s.n>=0&&Number.isInteger(s.ok)&&s.ok>=0&&s.ok<=s.n){clean.stats[c.id]={n:s.n,ok:s.ok,streak:Number.isInteger(s.streak)&&s.streak>=0?s.streak:0,last:Number.isFinite(s.last)?s.last:0,lastOK:s.lastOK===true,dates:Array.isArray(s.dates)?s.dates.filter(x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)).slice(-20):[]}}if(Number.isFinite(p.seen?.[c.id]))clean.seen[c.id]=p.seen[c.id]}for(const s of DATA.skills)if(['À découvrir','Montré au club','Pratiqué avec aide','Réalisé et vérifié au club'].includes(p.skills?.[s.id]))clean.skills[s.id]=p.skills[s.id];if(Array.isArray(p.history))clean.history=p.history.filter(h=>Number.isFinite(h.date)&&Number.isInteger(h.score)&&Number.isInteger(h.total)&&h.score>=0&&h.score<=h.total&&Array.isArray(h.chapters)&&h.chapters.every(c=>chBy[c])).slice(0,50);if(!confirm('Remplacer la progression de cette version ?'))return;prefs=clean;const saved=save();parent();$('notice').textContent=saved?'Sauvegarde importée.':'Importée pour cette session, mais stockage local indisponible.'}catch(e){$('notice').textContent='Fichier non reconnu. Aucun changement.'}}
function sources(){stop();state=null;$('app').innerHTML=`<span class="eyebrow">Documentation et transparence</span><h1>Apprendre avec des repères.</h1><section class="card glass"><h2>Ce que couvre cette version</h2><p>21 chapitres, 178 notions : 139 dans un parcours de préparation G1 et 39 bonus. Chaque notion a sa leçon et sa question. Les exercices des schémas peuvent proposer deux modalités : trouver un repère ou nommer la partie indiquée.</p><p>Le parcours reprend les grandes catégories de connaissances et prépare la compréhension des soins et gestes. Il ne remplace ni le Guide complet ni les cours. Les listes détaillées du matériel sont une décomposition pédagogique, pas une liste nationale de questions obligatoires.</p><h2>Limites visuelles et pédagogiques</h2><ul><li>Schémas originaux simplifiés : le matériel réel varie.</li><li>Pas de vidéos réelles d’allures : les rythmes ne valident pas la reconnaissance du mouvement.</li><li>Pas de photographies : reconnaître une illustration n’assure pas de reconnaître tous les chevaux ou aliments réels.</li><li>Le foin et la paille ne se distinguent pas uniquement par leur couleur. Observe de vrais échantillons au club.</li><li>Les états émotionnels sont travaillés par scénarios textuels. Ils ne sont pas diagnostiqués à partir d’une image isolée.</li><li>Les exercices ne sont pas des questions officielles FFE. Aucun seuil de réussite fédéral n’est simulé.</li><li>Les bonus ne sont pas inclus par défaut dans les tests G1.</li></ul><h2>Sources consultées le 8 novembre 2026</h2>${Object.entries(DATA.sources).map(([k,s])=>`<div class="listrow"><a href="${s.url}" target="_blank" rel="noopener">${esc(s.title)}</a><p class="muted">${esc(s.detail)}</p></div>`).join('')}<h2>Technique et vie privée</h2><p>Fichier HTML autonome, sans bibliothèque, image ou police distante. Pas de compte, pas de publicité, pas de microphone. Les liens documentaires ouvrent Internet. Le moteur vocal du navigateur peut être local ou distant. Pas de voix premium incluse.</p><p>La voix peut nécessiter un premier geste de l’utilisateur. Le bouton « Réécouter » reste disponible. Les effets de verre sont décoratifs, avec un fond clair de secours.</p><p>Ce fichier n’est pas une PWA hébergée et installable. Il peut être ouvert localement lorsque le navigateur le permet. Le stockage local et le son doivent être testés sur l’appareil réel.</p></section><button class="primary wide" onclick="home()">Retour à l’accueil</button>`}
home();
</script></body></html>
