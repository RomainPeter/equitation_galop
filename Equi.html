</style></head><body><header><div class="brand">équi.<small>Mon premier Galop</small></div><div class="row"><button class="small" onclick="navHome()">Accueil</button><button class="small" onclick="navParent()">Parent</button></div></header><main id="app"></main><script>const DATA={"chapters": [{"id": "corps", "title": "Le corps du cheval", "subtitle": "18 repères du Guide fédéral", "level": "g1", "icon": "horse"}, {"id": "robes", "title": "Les trois robes de base", "subtitle": "Noir, alezan, bai", "level": "g1", "icon": "palette"}, {"id": "allures", "title": "Pas, trot et galop", "subtitle": "Reconnaître et comprendre les rythmes", "level": "g1", "icon": "waves"}, {"id": "licol", "title": "Le licol et la longe", "subtitle": "Reconnaître les parties d’un licol plat", "level": "g1", "icon": "tack"}, {"id": "selle", "title": "La selle", "subtitle": "Les pièces et leurs fonctions", "level": "g1", "icon": "tack"}, {"id": "filet", "title": "Le filet", "subtitle": "Repérer le filet classique avec mors", "level": "g1", "icon": "tack"}, {"id": "aides", "title": "Les aides du cavalier", "subtitle": "Communiquer, pas faire mal", "level": "g1", "icon": "spark"}, {"id": "comportement", "title": "Comprendre le cheval", "subtitle": "Observer tout le corps et la situation", "level": "g1", "icon": "heart"}, {"id": "securitepied", "title": "En sécurité à pied", "subtitle": "Des décisions prudentes", "level": "g1", "icon": "shield"}, {"id": "securitemontee", "title": "En sécurité à cheval", "subtitle": "Casque, distance et consignes", "level": "g1", "icon": "shield"}, {"id": "soins", "title": "S’occuper de sa monture", "subtitle": "Avant et après la séance", "level": "g1", "icon": "brush"}, {"id": "club", "title": "Mon club et la fédération", "subtitle": "Lieux, licence et règles communes", "level": "g1", "icon": "home"}, {"id": "vocabulaire", "title": "Les mots du cavalier", "subtitle": "Comprendre les consignes du cours", "level": "g1", "icon": "book"}, {"id": "pied", "title": "Comprendre la pratique à pied", "subtitle": "Préparer les gestes, pas les certifier", "level": "g1", "icon": "route"}, {"id": "monte", "title": "Comprendre la pratique montée", "subtitle": "Les objectifs à travailler avec l’enseignant", "level": "g1", "icon": "horse"}, {"id": "aliments", "title": "Herbe, foin et aliments", "subtitle": "Bonus : anticipation du Galop 2", "level": "bonus", "icon": "leaf"}, {"id": "membres", "title": "Les détails des membres", "subtitle": "Bonus : vocabulaire du Galop 2", "level": "bonus", "icon": "horse"}, {"id": "decouvertes", "title": "Vie et communication", "subtitle": "Bonus : observer davantage", "level": "bonus", "icon": "heart"}, {"id": "robesplus", "title": "Autres robes et marques", "subtitle": "Bonus : repères G2 et G3", "level": "bonus", "icon": "palette"}, {"id": "outils", "title": "Les outils du pansage", "subtitle": "Bonus : approfondir le Galop 2", "level": "bonus", "icon": "brush"}, {"id": "figures", "title": "Les figures et les lieux de vie", "subtitle": "Bonus : repères du Galop 2", "level": "bonus", "icon": "route"}], "cards": [{"id": "corps_01", "ch": "corps", "title": "La tête", "text": "La tête porte notamment les yeux, les oreilles, la bouche et les naseaux.", "q": "Trouve la tête sur le cheval.", "answer": "La tête", "wrong": ["La crinière", "L’encolure", "Les naseaux"], "source": "GUIDE", "level": "g1", "diagram": "horse", "target": "tete"}, {"id": "corps_02", "ch": "corps", "title": "La crinière", "text": "La crinière est l’ensemble des longs crins qui suivent le dessus de l’encolure.", "q": "Trouve la crinière sur le cheval.", "answer": "La crinière", "wrong": ["La tête", "L’encolure", "Les naseaux"], "source": "GUIDE", "level": "g1", "diagram": "horse", "target": "criniere"}, {"id": "corps_03", "ch": "corps", "title": "L’encolure", "text": "L’encolure relie la tête au corps.", "q": "Trouve l’encolure sur le cheval.", "answer": "L’encolure", "wrong": ["La tête", "La crinière", "Les naseaux"], "source": "GUIDE", "level": "g1", "diagram": "horse", "target": "encolure"}, {"id": "corps_04", "ch": "corps", "title": "Les naseaux", "text": "Les naseaux sont les ouvertures du nez.", "q": "Trouve les naseaux sur le cheval.", "answer": "Les naseaux", "wrong": ["La tête", "La crinière", "L’encolure"], "source": "GUIDE", "level": "g1", "diagram": "horse", "target": "naseaux"}, {"id": "corps_05", "ch": "corps", "title": "Le poitrail", "text": "Le poitrail est à l’avant du thorax, entre les épaules et au-dessus des membres de devant.", "q": "Trouve le poitrail sur le cheval.", "answer": "Le poitrail", "wrong": ["La tête", "La crinière", "L’encolure"], "source": "GUIDE", "level": "g1", "diagram": "horse", "target": "poitrail"}, {"id": "corps_06", "ch": "corps", "title": "L’épaule", "text": "L’épaule est sur le côté de l’avant du corps, à la jonction avec un membre antérieur.", "q": "Trouve l’épaule sur le cheval.", "answer": "L’épaule", "wrong": ["La tête", "La crinière", "L’encolure"], "source": "GUIDE", "level": "g1", "diagram": "horse", "target": "epaule"}, {"id": "corps_07", "ch": "corps", "title": "Les membres antérieurs", "text": "Les antérieurs sont les deux membres de devant.", "q": "Trouve les membres antérieurs sur le cheval.", "answer": "Les membres antérieurs", "wrong": ["La tête", "La crinière", "L’encolure"], "source": "GUIDE", "level": "g1", "diagram": "horse", "target": "anterieurs"}, {"id": "corps_08", "ch": "corps", "title": "Les sabots", "text": "Les sabots sont les enveloppes dures à l’extrémité des membres. Le cheval en a quatre.", "q": "Trouve les sabots sur le cheval.", "answer": "Les sabots", "wrong": ["La tête", "La crinière", "L’encolure"], "source": "GUIDE", "level": "g1", "diagram": "horse", "target": "sabots"}, {"id": "corps_09", "ch": "corps", "title": "Le garrot", "text": "Le garrot se trouve entre l’encolure et le dos, au-dessus des épaules.", "q": "Trouve le garrot sur le cheval.", "answer": "Le garrot", "wrong": ["La tête", "La crinière", "L’encolure"], "source": "GUIDE", "level": "g1", "diagram": "horse", "target": "garrot"}, {"id": "corps_10", "ch": "corps", "title": "Le dos", "text": "Le dos est sur le dessus du corps, derrière le garrot.", "q": "Trouve le dos sur le cheval.", "answer": "Le dos", "wrong": ["La tête", "La crinière", "L’encolure"], "source": "GUIDE", "level": "g1", "diagram": "horse", "target": "dos"}, {"id": "corps_11", "ch": "corps", "title": "Le rein", "text": "La région du rein se situe sur le dessus du corps, entre le dos et la croupe.", "q": "Trouve le rein sur le cheval.", "answer": "Le rein", "wrong": ["La tête", "La crinière", "L’encolure"], "source": "GUIDE", "level": "g1", "diagram": "horse", "target": "rein"}, {"id": "corps_12", "ch": "corps", "title": "Le ventre", "text": "Le ventre est la partie inférieure du tronc.", "q": "Trouve le ventre sur le cheval.", "answer": "Le ventre", "wrong": ["La tête", "La crinière", "L’encolure"], "source": "GUIDE", "level": "g1", "diagram": "horse", "target": "ventre"}, {"id": "corps_13", "ch": "corps", "title": "Les côtes", "text": "La région des côtes est sur les côtés du thorax, derrière l’épaule.", "q": "Trouve les côtes sur le cheval.", "answer": "Les côtes", "wrong": ["La tête", "La crinière", "L’encolure"], "source": "GUIDE", "level": "g1", "diagram": "horse", "target": "cotes"}, {"id": "corps_14", "ch": "corps", "title": "Le flanc", "text": "Le flanc est le côté du corps entre les dernières côtes et la hanche.", "q": "Trouve le flanc sur le cheval.", "answer": "Le flanc", "wrong": ["La tête", "La crinière", "L’encolure"], "source": "GUIDE", "level": "g1", "diagram": "horse", "target": "flanc"}, {"id": "corps_15", "ch": "corps", "title": "La hanche", "text": "La hanche est un repère de l’arrière-main, sur le côté à l’avant de la croupe.", "q": "Trouve la hanche sur le cheval.", "answer": "La hanche", "wrong": ["La tête", "La crinière", "L’encolure"], "source": "GUIDE", "level": "g1", "diagram": "horse", "target": "hanche"}, {"id": "corps_16", "ch": "corps", "title": "La croupe", "text": "La croupe est sur le dessus de l’arrière du corps, avant la queue.", "q": "Trouve la croupe sur le cheval.", "answer": "La croupe", "wrong": ["La tête", "La crinière", "L’encolure"], "source": "GUIDE", "level": "g1", "diagram": "horse", "target": "croupe"}, {"id": "corps_17", "ch": "corps", "title": "La queue", "text": "La queue porte les longs crins situés à l’arrière du cheval.", "q": "Trouve la queue sur le cheval.", "answer": "La queue", "wrong": ["La tête", "La crinière", "L’encolure"], "source": "GUIDE", "level": "g1", "diagram": "horse", "target": "queue"}, {"id": "corps_18", "ch": "corps", "title": "Les membres postérieurs", "text": "Les postérieurs sont les deux membres de derrière.", "q": "Trouve les membres postérieurs sur le cheval.", "answer": "Les membres postérieurs", "wrong": ["La tête", "La crinière", "L’encolure"], "source": "GUIDE", "level": "g1", "diagram": "horse", "target": "posterieurs"}, {"id": "robes_01", "ch": "robes", "title": "Noir", "text": "La robe noire présente des poils et des crins noirs.", "q": "Quel cheval a une robe noir ?", "answer": "Noir", "wrong": ["Alezan", "Bai"], "source": "JARDY", "level": "g1", "visual": "coat:noir"}, {"id": "robes_02", "ch": "robes", "title": "Alezan", "text": "Un cheval alezan a des poils et des crins dans des tons fauves ou roux. Il n’a pas les crins et extrémités noirs caractéristiques du bai.", "q": "Quel cheval a une robe alezan ?", "answer": "Alezan", "wrong": ["Noir", "Bai"], "source": "JARDY", "level": "g1", "visual": "coat:alezan"}, {"id": "robes_03", "ch": "robes", "title": "Bai", "text": "Le bai a le corps brun ou fauve, avec la crinière, la queue et le bas des membres noirs.", "q": "Quel cheval a une robe bai ?", "answer": "Bai", "wrong": ["Noir", "Alezan"], "source": "JARDY", "level": "g1", "visual": "coat:bai"}, {"id": "robes_04", "ch": "robes", "title": "Bai ou alezan ?", "text": "Pour distinguer un bai d’un alezan, observe aussi la crinière, la queue et le bas des membres. Ne regarde pas seulement le corps.", "q": "Le corps est brun et les crins sont noirs. Quelle est la robe ?", "answer": "Bai", "wrong": ["Alezan", "Noir"], "source": "JARDY", "level": "g1"}, {"id": "robes_05", "ch": "robes", "title": "Robe et race", "text": "La robe décrit la couleur des poils et des crins. Ce n’est pas le nom d’une race.", "q": "Que décrit le mot « robe » ?", "answer": "La couleur des poils et des crins", "wrong": ["Le métier du cheval", "Le nom de son club"], "source": "FFE", "level": "g1"}, {"id": "allures_01", "ch": "allures", "title": "Les trois allures", "text": "Les trois allures principales sont le pas, le trot et le galop. Une allure est une façon de se déplacer.", "q": "Quelle liste contient les trois allures principales ?", "answer": "Pas, trot, galop", "wrong": ["Arrêt, selle, trot", "Bai, noir, alezan"], "source": "GUIDE", "level": "g1", "visual": "rhythm:all"}, {"id": "allures_02", "ch": "allures", "title": "Le pas", "text": "Le pas est une allure marchée à quatre temps. Il n’y a pas de phase où tous les pieds quittent le sol.", "q": "Quelle allure est marchée à quatre temps ?", "answer": "Le pas", "wrong": ["Le trot", "Le galop"], "source": "GUIDE", "level": "g1", "visual": "rhythm:pas"}, {"id": "allures_03", "ch": "allures", "title": "Le trot", "text": "Le trot est une allure sautée à deux temps. Il comporte des phases de suspension.", "q": "Quelle allure est sautée à deux temps ?", "answer": "Le trot", "wrong": ["Le pas", "Le galop"], "source": "GUIDE", "level": "g1", "visual": "rhythm:trot"}, {"id": "allures_04", "ch": "allures", "title": "Le galop", "text": "Le galop usuel est une allure sautée à trois temps, avec une phase de suspension.", "q": "Quelle allure compte habituellement trois temps ?", "answer": "Le galop", "wrong": ["Le pas", "Le trot"], "source": "GUIDE", "level": "g1", "visual": "rhythm:galop"}, {"id": "allures_05", "ch": "allures", "title": "La suspension", "text": "Une phase de suspension est un moment où aucun pied ne touche le sol. Le trot et le galop en comportent.", "q": "Pendant la suspension, combien de pieds touchent le sol ?", "answer": "Aucun", "wrong": ["Deux", "Quatre"], "source": "GUIDE", "level": "g1", "visual": "rhythm:all"}, {"id": "allures_06", "ch": "allures", "title": "Une transition", "text": "Une transition est un passage d’une allure à une autre, ou entre l’arrêt et une allure. Par exemple : passer du pas au trot.", "q": "Passer du pas au trot, c’est…", "answer": "Une transition", "wrong": ["Une robe", "Une partie de la selle"], "source": "GUIDE", "level": "g1", "visual": "rhythm:all"}, {"id": "licol_01", "ch": "licol", "title": "La têtière", "text": "La têtière passe derrière les oreilles et maintient le licol.", "q": "Trouve la têtière sur le licol.", "answer": "La têtière", "wrong": ["La muserolle", "Le montant", "La sous-gorge"], "source": "JARDY", "level": "g1", "diagram": "halter", "target": "tetiere"}, {"id": "licol_02", "ch": "licol", "title": "La muserolle", "text": "La muserolle entoure le nez du cheval.", "q": "Trouve la muserolle sur le licol.", "answer": "La muserolle", "wrong": ["La têtière", "Le montant", "La sous-gorge"], "source": "JARDY", "level": "g1", "diagram": "halter", "target": "muserolle"}, {"id": "licol_03", "ch": "licol", "title": "Le montant", "text": "Un montant relie des parties du licol sur le côté de la tête.", "q": "Trouve le montant sur le licol.", "answer": "Le montant", "wrong": ["La têtière", "La muserolle", "La sous-gorge"], "source": "JARDY", "level": "g1", "diagram": "halter", "target": "montant"}, {"id": "licol_04", "ch": "licol", "title": "La sous-gorge", "text": "La sous-gorge passe sous la gorge.", "q": "Trouve la sous-gorge sur le licol.", "answer": "La sous-gorge", "wrong": ["La têtière", "La muserolle", "Le montant"], "source": "JARDY", "level": "g1", "diagram": "halter", "target": "sousgorge"}, {"id": "licol_05", "ch": "licol", "title": "L’alliance", "text": "L’alliance relie sous la tête la muserolle à la partie située vers la gorge.", "q": "Trouve l’alliance sur le licol.", "answer": "L’alliance", "wrong": ["La têtière", "La muserolle", "Le montant"], "source": "JARDY", "level": "g1", "diagram": "halter", "target": "alliance"}, {"id": "licol_06", "ch": "licol", "title": "L’anneau d’attache", "text": "L’anneau d’attache permet de fixer la longe au licol.", "q": "Trouve l’anneau d’attache sur le licol.", "answer": "L’anneau d’attache", "wrong": ["La têtière", "La muserolle", "Le montant"], "source": "JARDY", "level": "g1", "diagram": "halter", "target": "anneau"}, {"id": "licol_07", "ch": "licol", "title": "La longe", "text": "La longe est la corde fixée au licol pour mener le cheval et, dans les conditions montrées par l’enseignant, l’attacher.", "q": "Que fixe-t-on au licol pour mener le cheval ?", "answer": "Une longe", "wrong": ["Un étrier", "Un tapis"], "source": "JARDY", "level": "g1", "visual": "object:rope"}, {"id": "licol_08", "ch": "licol", "title": "Licol et filet", "text": "Le licol courant n’a pas de mors. Le filet classique présenté ici comporte un mors et des rênes. Ce sont deux équipements différents.", "q": "Quel équipement présenté ici n’a pas de mors ?", "answer": "Le licol", "wrong": ["Le filet classique", "Les deux ont forcément un mors"], "source": "JARDY", "level": "g1"}, {"id": "selle_01", "ch": "selle", "title": "Le siège", "text": "Le siège est la partie sur laquelle le cavalier s’assoit.", "q": "Trouve le siège sur la selle.", "answer": "Le siège", "wrong": ["Le pommeau", "Le troussequin", "Le quartier"], "source": "JARDY", "level": "g1", "diagram": "saddle", "target": "siege"}, {"id": "selle_02", "ch": "selle", "title": "Le pommeau", "text": "Le pommeau est la partie avant de la selle.", "q": "Trouve le pommeau sur la selle.", "answer": "Le pommeau", "wrong": ["Le siège", "Le troussequin", "Le quartier"], "source": "JARDY", "level": "g1", "diagram": "saddle", "target": "pommeau"}, {"id": "selle_03", "ch": "selle", "title": "Le troussequin", "text": "Le troussequin est la partie arrière relevée de la selle.", "q": "Trouve le troussequin sur la selle.", "answer": "Le troussequin", "wrong": ["Le siège", "Le pommeau", "Le quartier"], "source": "JARDY", "level": "g1", "diagram": "saddle", "target": "troussequin"}, {"id": "selle_04", "ch": "selle", "title": "Le quartier", "text": "Les quartiers sont les grandes pièces de cuir sur les côtés de la selle.", "q": "Trouve le quartier sur la selle.", "answer": "Le quartier", "wrong": ["Le siège", "Le pommeau", "Le troussequin"], "source": "JARDY", "level": "g1", "diagram": "saddle", "target": "quartier"}, {"id": "selle_05", "ch": "selle", "title": "L’étrivière", "text": "L’étrivière est la courroie qui porte l’étrier.", "q": "Trouve l’étrivière sur la selle.", "answer": "L’étrivière", "wrong": ["Le siège", "Le pommeau", "Le troussequin"], "source": "JARDY", "level": "g1", "diagram": "saddle", "target": "etriviere"}, {"id": "selle_06", "ch": "selle", "title": "L’étrier", "text": "L’étrier reçoit le pied du cavalier.", "q": "Trouve l’étrier sur la selle.", "answer": "L’étrier", "wrong": ["Le siège", "Le pommeau", "Le troussequin"], "source": "JARDY", "level": "g1", "diagram": "saddle", "target": "etrier"}, {"id": "selle_07", "ch": "selle", "title": "La sangle", "text": "La sangle passe sous le ventre et aide à maintenir la selle.", "q": "Trouve la sangle sur la selle.", "answer": "La sangle", "wrong": ["Le siège", "Le pommeau", "Le troussequin"], "source": "JARDY", "level": "g1", "diagram": "saddle", "target": "sangle"}, {"id": "selle_08", "ch": "selle", "title": "Les contre-sanglons", "text": "Les contre-sanglons sont les courroies auxquelles on boucle la sangle.", "q": "Trouve les contre-sanglons sur la selle.", "answer": "Les contre-sanglons", "wrong": ["Le siège", "Le pommeau", "Le troussequin"], "source": "JARDY", "level": "g1", "diagram": "saddle", "target": "contresanglons"}, {"id": "selle_09", "ch": "selle", "title": "Le tapis", "text": "Le tapis se place sous la selle. Il est distinct de la selle et de la sangle.", "q": "Que place-t-on sous la selle ?", "answer": "Le tapis", "wrong": ["Le licol", "La sous-gorge"], "source": "JARDY", "level": "g1", "visual": "object:pad"}, {"id": "filet_01", "ch": "filet", "title": "La têtière", "text": "La têtière passe derrière les oreilles.", "q": "Trouve la têtière sur le filet.", "answer": "La têtière", "wrong": ["Le frontal", "Le montant", "La sous-gorge"], "source": "JARDY", "level": "g1", "diagram": "bridle", "target": "tetiere"}, {"id": "filet_02", "ch": "filet", "title": "Le frontal", "text": "Le frontal passe devant le front, sous les oreilles.", "q": "Trouve le frontal sur le filet.", "answer": "Le frontal", "wrong": ["La têtière", "Le montant", "La sous-gorge"], "source": "JARDY", "level": "g1", "diagram": "bridle", "target": "frontal"}, {"id": "filet_03", "ch": "filet", "title": "Le montant", "text": "Les montants du filet relient notamment la têtière au mors.", "q": "Trouve le montant sur le filet.", "answer": "Le montant", "wrong": ["La têtière", "Le frontal", "La sous-gorge"], "source": "JARDY", "level": "g1", "diagram": "bridle", "target": "montant"}, {"id": "filet_04", "ch": "filet", "title": "La sous-gorge", "text": "La sous-gorge passe sous la gorge.", "q": "Trouve la sous-gorge sur le filet.", "answer": "La sous-gorge", "wrong": ["La têtière", "Le frontal", "Le montant"], "source": "JARDY", "level": "g1", "diagram": "bridle", "target": "sousgorge"}, {"id": "filet_05", "ch": "filet", "title": "La muserolle", "text": "La muserolle entoure le nez. Les filets peuvent avoir des modèles de muserolles différents, ou ne pas en avoir.", "q": "Trouve la muserolle sur le filet.", "answer": "La muserolle", "wrong": ["La têtière", "Le frontal", "Le montant"], "source": "JARDY", "level": "g1", "diagram": "bridle", "target": "muserolle"}, {"id": "filet_06", "ch": "filet", "title": "Le mors", "text": "Le mors se place dans la bouche. Les actions sur les rênes doivent rester contrôlées car la bouche est sensible.", "q": "Trouve le mors sur le filet.", "answer": "Le mors", "wrong": ["La têtière", "Le frontal", "Le montant"], "source": "JARDY", "level": "g1", "diagram": "bridle", "target": "mors"}, {"id": "filet_07", "ch": "filet", "title": "Les rênes", "text": "Le cavalier tient les rênes. Elles relient ses mains au mors sur le filet classique présenté.", "q": "Trouve les rênes sur le filet.", "answer": "Les rênes", "wrong": ["La têtière", "Le frontal", "Le montant"], "source": "JARDY", "level": "g1", "diagram": "bridle", "target": "renes"}, {"id": "aides_01", "ch": "aides", "title": "Les aides", "text": "Les aides sont les moyens de communication du cavalier avec le cheval. Elles transmettent des demandes.", "q": "À quoi servent les aides ?", "answer": "À communiquer avec le cheval", "wrong": ["À le punir", "À le nourrir"], "source": "GUIDE", "level": "g1"}, {"id": "aides_02", "ch": "aides", "title": "Les aides naturelles", "text": "Les aides naturelles viennent du corps : mains, jambes, poids du corps et voix.", "q": "Quelle liste ne contient que des aides naturelles ?", "answer": "Mains, jambes, voix", "wrong": ["Cravache, éperons, voix", "Selle, tapis, licol"], "source": "GUIDE", "level": "g1"}, {"id": "aides_03", "ch": "aides", "title": "Les mains", "text": "Les mains font partie des aides naturelles.", "q": "Classe cette aide : les mains.", "answer": "Aide naturelle", "wrong": ["Aide artificielle", "Aliment"], "source": "GUIDE", "level": "g1"}, {"id": "aides_04", "ch": "aides", "title": "Les jambes", "text": "Les jambes font partie des aides naturelles.", "q": "Classe cette aide : les jambes.", "answer": "Aide naturelle", "wrong": ["Aide artificielle", "Aliment"], "source": "GUIDE", "level": "g1"}, {"id": "aides_05", "ch": "aides", "title": "La voix", "text": "La voix fait partie des aides naturelles.", "q": "Classe cette aide : la voix.", "answer": "Aide naturelle", "wrong": ["Aide artificielle", "Aliment"], "source": "GUIDE", "level": "g1"}, {"id": "aides_06", "ch": "aides", "title": "Le poids du corps", "text": "Le poids du corps fait partie des aides naturelles.", "q": "Classe cette aide : le poids du corps.", "answer": "Aide naturelle", "wrong": ["Aide artificielle", "Aliment"], "source": "GUIDE", "level": "g1"}, {"id": "aides_07", "ch": "aides", "title": "La cravache", "text": "La cravache : aide artificielle, c’est-à-dire un objet qui complète les aides naturelles. Reconnaître cet objet ne signifie pas devoir l’utiliser.", "q": "Classe cette aide : la cravache.", "answer": "Aide artificielle", "wrong": ["Aide naturelle", "Une allure"], "source": "GUIDE", "level": "g1"}, {"id": "aides_08", "ch": "aides", "title": "Les éperons", "text": "Les éperons : aide artificielle, c’est-à-dire un objet qui complète les aides naturelles. Reconnaître cet objet ne signifie pas devoir l’utiliser.", "q": "Classe cette aide : les éperons.", "answer": "Aide artificielle", "wrong": ["Aide naturelle", "Une allure"], "source": "GUIDE", "level": "g1"}, {"id": "aides_09", "ch": "aides", "title": "La chambrière", "text": "La chambrière : aide artificielle, c’est-à-dire un objet qui complète les aides naturelles. Reconnaître cet objet ne signifie pas devoir l’utiliser.", "q": "Classe cette aide : la chambrière.", "answer": "Aide artificielle", "wrong": ["Aide naturelle", "Une allure"], "source": "GUIDE", "level": "g1"}, {"id": "aides_10", "ch": "aides", "title": "Des mains contrôlées", "text": "Sur un filet classique, les mains agissent par les rênes et le mors. La bouche est sensible : on évite les mouvements brusques et les tractions involontaires.", "q": "Pourquoi faut-il contrôler ses mains ?", "answer": "La bouche du cheval est sensible", "wrong": ["Pour tirer toujours plus fort", "Pour faire du bruit"], "source": "GUIDE", "level": "g1"}, {"id": "aides_11", "ch": "aides", "title": "Le respect reste la règle", "text": "Les aides servent à communiquer. Leur emploi ne doit jamais devenir un prétexte à la violence. On apprend les gestes avec l’enseignant.", "q": "Si une demande ne marche pas, que fais-tu ?", "answer": "Je demande conseil à mon enseignant", "wrong": ["Je frappe le cheval", "Je multiplie les gestes brusques"], "source": "GUIDE", "level": "g1"}, {"id": "comportement_01", "ch": "comportement", "title": "Un être sensible", "text": "Le cheval est un animal vivant et sensible. S’en occuper et le respecter font partie de l’équitation.", "q": "L’équitation, c’est aussi…", "answer": "S’occuper du cheval et le comprendre", "wrong": ["Seulement rester en selle", "Utiliser un animal comme un jouet"], "source": "GUIDE", "level": "g1"}, {"id": "comportement_02", "ch": "comportement", "title": "Un poney n’est pas un bébé", "text": "Poneys et chevaux appartiennent à la même espèce. Un poney peut être adulte.", "q": "Un poney est-il forcément un bébé cheval ?", "answer": "Non, il peut être adulte", "wrong": ["Oui, toujours", "Il devient forcément un grand cheval"], "source": "GUIDE", "level": "g1"}, {"id": "comportement_03", "ch": "comportement", "title": "Herbivore", "text": "Un herbivore se nourrit de végétaux. Le cheval est herbivore.", "q": "Que signifie « herbivore » ?", "answer": "Qui se nourrit de végétaux", "wrong": ["Qui mange seulement de la viande", "Qui n’a pas besoin de manger"], "source": "GUIDE", "level": "g1"}, {"id": "comportement_04", "ch": "comportement", "title": "Grégaire", "text": "Le cheval est grégaire : il recherche la compagnie d’autres chevaux.", "q": "Que signifie « grégaire » ?", "answer": "Qui recherche la vie en groupe", "wrong": ["Qui doit rester seul", "Qui ne dort jamais"], "source": "GUIDE", "level": "g1"}, {"id": "comportement_05", "ch": "comportement", "title": "Éviter la surprise", "text": "Un changement brusque peut provoquer une fuite ou une défense. Il faut éviter de surprendre le cheval.", "q": "Pourquoi faut-il éviter de le surprendre ?", "answer": "Il peut réagir brusquement par peur", "wrong": ["Il ne remarque jamais rien", "Il comprend tous nos gestes à l’avance"], "source": "GUIDE", "level": "g1"}, {"id": "comportement_06", "ch": "comportement", "title": "Plusieurs signes ensemble", "text": "Observe les oreilles, le regard, la tête, l’encolure, les membres, la queue et la tension du corps. Un seul signe ne suffit pas toujours.", "q": "Pour comprendre son attitude, je regarde…", "answer": "Tout le corps et le contexte", "wrong": ["Seulement une oreille", "Seulement la couleur de la robe"], "source": "COM", "level": "g1"}, {"id": "comportement_07", "ch": "comportement", "title": "La vigilance", "text": "Une tête très haute, des oreilles fixées vers un événement et un corps tendu peuvent signaler une vigilance. Il faut regarder le contexte.", "q": "Le cheval est tendu et regarde fixement un bruit. Que comprends-tu ?", "answer": "Quelque chose l’alerte", "wrong": ["Il est forcément heureux", "Sa robe va changer"], "source": "COM", "level": "g1"}, {"id": "comportement_08", "ch": "comportement", "title": "Le repos debout", "text": "Un cheval peut se reposer debout, le corps détendu, parfois avec un postérieur au repos.", "q": "Un cheval détendu avec un postérieur au repos peut…", "answer": "Se reposer", "wrong": ["Être forcément blessé", "Être forcément en colère"], "source": "COM", "level": "g1"}, {"id": "comportement_09", "ch": "comportement", "title": "Une menace", "text": "Oreilles plaquées et mouvements menaçants peuvent annoncer une défense. On ne poursuit pas l’approche et on demande de l’aide.", "q": "Un cheval menace de mordre. Que fais-tu ?", "answer": "Je me mets en sécurité et je demande de l’aide", "wrong": ["Je m’approche de sa bouche", "Je le défie"], "source": "COM", "level": "g1"}, {"id": "comportement_10", "ch": "comportement", "title": "Les oreilles ne disent pas tout", "text": "Des oreilles en avant indiquent notamment une orientation de l’attention. Elles ne prouvent pas à elles seules que le cheval est content.", "q": "Des oreilles en avant prouvent-elles qu’il est heureux ?", "answer": "Non, il faut observer les autres signes", "wrong": ["Oui, toujours", "Elles indiquent sa race"], "source": "COM", "level": "g1"}, {"id": "comportement_11", "ch": "comportement", "title": "Les caresses", "text": "Tous les chevaux n’apprécient pas les mêmes contacts. Observe leurs réactions et respecte-les.", "q": "Le cheval semble gêné par mon contact. Que fais-tu ?", "answer": "Je cesse et je demande conseil", "wrong": ["J’insiste pour le forcer", "Je le punis"], "source": "COM", "level": "g1"}, {"id": "comportement_12", "ch": "comportement", "title": "Le hennissement", "text": "Le hennissement peut servir à rétablir le contact lors d’une séparation. Un son ne s’interprète pas sans contexte.", "q": "Le hennissement peut servir à…", "answer": "Rétablir le contact avec un autre cheval", "wrong": ["Nommer sa robe", "Remplacer toute observation"], "source": "COM", "level": "g1"}, {"id": "securitepied_01", "ch": "securitepied", "title": "Prévenir de sa présence", "text": "Avant d’approcher, capte calmement l’attention du cheval. Ne surgis pas en silence dans son dos.", "q": "Avant de m’approcher, je…", "answer": "Capte calmement son attention", "wrong": ["Crie tout près de lui", "Le surprends par derrière"], "source": "JARDY", "level": "g1"}, {"id": "securitepied_02", "ch": "securitepied", "title": "Des gestes calmes", "text": "Auprès du cheval, évite les cris, les courses et les gestes brusques.", "q": "Comment me comporter près du cheval ?", "answer": "Avec calme et attention", "wrong": ["En courant autour de lui", "En agitant les bras brusquement"], "source": "JARDY", "level": "g1"}, {"id": "securitepied_03", "ch": "securitepied", "title": "La longe et la main", "text": "N’enroule jamais une longe autour de ta main ou de ton corps. Apprends à la tenir avec l’enseignant.", "q": "Puis-je enrouler la longe autour de ma main ?", "answer": "Non, jamais", "wrong": ["Oui, pour mieux tenir", "Oui, si le cheval est petit"], "source": "LONGE", "level": "g1"}, {"id": "securitepied_04", "ch": "securitepied", "title": "Changer de côté", "text": "La manière de changer de côté dépend du cheval, de l’attache et de l’espace. Suis la démonstration de l’enseignant ; ne te glisse pas au hasard.", "q": "Je ne sais pas comment changer de côté. Que faire ?", "answer": "Demander à l’enseignant de me montrer", "wrong": ["Me glisser n’importe où", "Passer sous le ventre"], "source": "JARDY", "level": "g1"}, {"id": "securitepied_05", "ch": "securitepied", "title": "Une situation qui inquiète", "text": "Si la réaction du cheval te met en difficulté, mets-toi en sécurité et appelle un adulte du club.", "q": "Le cheval s’agite et je ne maîtrise plus la situation. Je…", "answer": "Demande immédiatement de l’aide", "wrong": ["Reste seul pour prouver que je sais", "Tire de toutes mes forces"], "source": "JARDY", "level": "g1"}, {"id": "securitepied_06", "ch": "securitepied", "title": "Ne pas se faire coincer", "text": "Garde un espace et une possibilité de te dégager. Ne te place pas dans un passage étroit où le cheval pourrait te coincer.", "q": "Où éviter de me placer ?", "answer": "Coincée entre le cheval et un mur", "wrong": ["À l’endroit montré par l’enseignant", "Dans une zone dégagée avec l’adulte"], "source": "JARDY", "level": "g1"}, {"id": "securitepied_07", "ch": "securitepied", "title": "Un passage libre", "text": "Pour franchir une porte avec le cheval, il faut un passage dégagé et suffisamment ouvert, sous les consignes de l’enseignant.", "q": "La porte est trop peu ouverte. Que faire ?", "answer": "Faire dégager et ouvrir le passage avec l’adulte", "wrong": ["Forcer le cheval à passer", "Fermer davantage la porte"], "source": "JARDY", "level": "g1"}, {"id": "securitepied_08", "ch": "securitepied", "title": "Pas d’attache improvisée", "text": "Le nœud d’attache est un geste réel à apprendre au club. On ne l’improvise pas avec un enfant et un cheval.", "q": "Je ne sais pas faire le nœud d’attache. Je…", "answer": "Demande une démonstration à l’enseignant", "wrong": ["Invente un nœud très serré", "Attache avec les rênes"], "source": "JARDY", "level": "g1"}, {"id": "securitepied_09", "ch": "securitepied", "title": "La nourriture n’est pas un jouet", "text": "Ne donne pas d’aliment sans l’autorisation d’un responsable. La ration et les éventuelles restrictions doivent être respectées.", "q": "Puis-je distribuer une friandise à n’importe quel poney ?", "answer": "Seulement avec l’autorisation du responsable", "wrong": ["Oui, sans demander", "Oui, si je la cache"], "source": "FFE", "level": "g1"}, {"id": "securitepied_10", "ch": "securitepied", "title": "Un objet oublié", "text": "Range les objets et ne laisse pas de matériel dans le passage.", "q": "Que faire d’une brosse qui traîne dans le passage ?", "answer": "La ranger sans me mettre en danger", "wrong": ["La pousser sous les pieds du cheval", "Laisser tout le monde trébucher"], "source": "FFE", "level": "g1"}, {"id": "securitemontee_01", "ch": "securitemontee", "title": "Le casque", "text": "Porte un casque d’équitation adapté, bien ajusté et avec la jugulaire attachée.", "q": "Avant de monter, mon casque doit être…", "answer": "Ajusté et attaché", "wrong": ["Simplement posé sur ma tête", "Accroché à la selle"], "source": "JARDY", "level": "g1"}, {"id": "securitemontee_02", "ch": "securitemontee", "title": "Une tenue adaptée", "text": "Les vêtements et les chaussures doivent être adaptés à l’équitation. Fais vérifier ta tenue par l’enseignant.", "q": "Qui peut vérifier que ma tenue convient ?", "answer": "Mon enseignant", "wrong": ["Le cheval", "Personne, cela n’a aucune importance"], "source": "JARDY", "level": "g1"}, {"id": "securitemontee_03", "ch": "securitemontee", "title": "Attendre la consigne", "text": "On monte et on commence l’exercice selon les consignes de l’enseignant.", "q": "Avant de monter, je…", "answer": "Suis les consignes de l’enseignant", "wrong": ["Monte dès que j’en ai envie", "Pars sans prévenir"], "source": "JARDY", "level": "g1"}, {"id": "securitemontee_04", "ch": "securitemontee", "title": "Garder la distance", "text": "Garde la distance demandée avec les autres chevaux. Ne colle pas celui qui te précède.", "q": "Mon poney se rapproche trop de celui de devant. Je dois…", "answer": "Rétablir la distance selon les consignes", "wrong": ["Le laisser coller", "Le pousser à doubler sans prévenir"], "source": "JARDY", "level": "g1"}, {"id": "securitemontee_05", "ch": "securitemontee", "title": "Entrer sur la piste", "text": "Avant d’entrer dans un manège ou une carrière occupée, demande l’autorisation et attends la réponse.", "q": "Des cavaliers travaillent déjà. Avant d’entrer, je…", "answer": "Demande et j’attends l’autorisation", "wrong": ["Entre sans regarder", "Ouvre et me précipite"], "source": "JARDY", "level": "g1"}, {"id": "securitemontee_06", "ch": "securitemontee", "title": "Écouter en groupe", "text": "Les consignes organisent le groupe et protègent cavaliers et chevaux.", "q": "Si je n’ai pas compris une consigne, je…", "answer": "Demande qu’on me la réexplique", "wrong": ["Devine et pars au galop", "Fais l’inverse"], "source": "FFE", "level": "g1"}, {"id": "securitemontee_07", "ch": "securitemontee", "title": "Ne pas imiter sans autorisation", "text": "Une démonstration à l’écran ne t’autorise pas à tenter un geste seule. Les gestes se pratiquent avec l’enseignant.", "q": "J’ai vu un exercice dans l’application. Puis-je l’essayer seule à cheval ?", "answer": "Non, je le travaille avec l’enseignant", "wrong": ["Oui, l’application remplace le cours", "Oui, si je me dépêche"], "source": "FFE", "level": "g1"}, {"id": "soins_01", "ch": "soins", "title": "Avant et après", "text": "S’occuper de sa monture avant et après l’activité fait partie du Galop 1.", "q": "Quand s’occupe-t-on du cheval ?", "answer": "Avant et après la séance", "wrong": ["Uniquement quand on monte", "Jamais après le cours"], "source": "FFE", "level": "g1"}, {"id": "soins_02", "ch": "soins", "title": "Observer pendant le pansage", "text": "Le pansage permet aussi d’observer le corps et de repérer une blessure ou une réaction inhabituelle. Si tu remarques quelque chose, préviens l’enseignant.", "q": "Je remarque une blessure en brossant. Je…", "answer": "Préviens l’enseignant", "wrong": ["Cache la blessure", "Continue sans rien dire"], "source": "JARDY", "level": "g1"}, {"id": "soins_03", "ch": "soins", "title": "L’étrille", "text": "L’étrille aide à décoller la saleté sur les zones charnues. Son usage et les zones à éviter doivent être montrés au club.", "q": "À quoi sert l’étrille ?", "answer": "À décoller la saleté sur les zones adaptées", "wrong": ["À nettoyer le mors", "À tenir les rênes"], "source": "JARDY", "level": "g1", "visual": "object:curry"}, {"id": "soins_04", "ch": "soins", "title": "Les zones sensibles", "text": "On ne passe pas l’étrille sans distinction sur la tête et les zones osseuses. On suit la démonstration de l’enseignant.", "q": "Puis-je étriller la tête comme une zone charnue ?", "answer": "Non", "wrong": ["Oui, en appuyant fort", "Oui, avec n’importe quelle étrille"], "source": "JARDY", "level": "g1"}, {"id": "soins_05", "ch": "soins", "title": "La brosse", "text": "Une brosse permet d’enlever des saletés du poil. On adapte le geste à la sensibilité du cheval et aux consignes.", "q": "Que nettoie-t-on avec une brosse de pansage ?", "answer": "Le poil du cheval", "wrong": ["Les anneaux du mors uniquement", "Les écrans de la tablette"], "source": "JARDY", "level": "g1", "visual": "object:brush"}, {"id": "soins_06", "ch": "soins", "title": "Desseller", "text": "Desseller signifie enlever la selle. Le geste se travaille au club, en gardant la maîtrise de la monture et du matériel.", "q": "Que signifie « desseller » ?", "answer": "Enlever la selle", "wrong": ["Mettre le filet", "Faire trotter"], "source": "FFE", "level": "g1"}, {"id": "soins_07", "ch": "soins", "title": "Enlever le filet", "text": "Enlever le filet se fait dans un cadre sûr. On retire le mors avec douceur, sans le heurter contre les dents.", "q": "En retirant le mors, je veille à…", "answer": "Ne pas heurter les dents", "wrong": ["Le tirer brusquement", "Laisser tomber le filet"], "source": "JARDY", "level": "g1"}, {"id": "soins_08", "ch": "soins", "title": "Laver le mors", "text": "Après utilisation, on nettoie le mors et on retire les salissures, puis on range le matériel.", "q": "Que faut-il nettoyer après avoir enlevé le filet ?", "answer": "Le mors", "wrong": ["La crinière avec le mors", "Uniquement les étriers"], "source": "JARDY", "level": "g1"}, {"id": "soins_09", "ch": "soins", "title": "Ranger le matériel", "text": "Le matériel propre est rangé dans la sellerie, aux emplacements prévus.", "q": "Où range-t-on la selle et le filet ?", "answer": "Dans la sellerie", "wrong": ["Au milieu de la piste", "Dans l’abreuvoir"], "source": "FFE", "level": "g1"}, {"id": "soins_10", "ch": "soins", "title": "Le nœud d’attache", "text": "Au Galop 1, on apprend à reproduire un nœud d’attache. Ce geste doit être montré et vérifié au club.", "q": "Réussir une question sur le nœud prouve-t-il que je sais attacher un cheval ?", "answer": "Non, le geste doit être vérifié en vrai", "wrong": ["Oui, cela suffit", "Oui, sans aucune démonstration"], "source": "FFE", "level": "g1"}, {"id": "club_01", "ch": "club", "title": "Le club", "text": "Le club est le lieu où tu apprends l’équitation, avec des enseignants et des règles de fonctionnement.", "q": "Qui t’accompagne dans l’apprentissage au club ?", "answer": "L’enseignant d’équitation", "wrong": ["Le moteur de la tablette", "La selle"], "source": "FFE", "level": "g1"}, {"id": "club_02", "ch": "club", "title": "La sellerie", "text": "La sellerie est le lieu où l’on range le matériel d’équitation.", "q": "Où va-t-on chercher une selle ?", "answer": "À la sellerie", "wrong": ["Dans l’abreuvoir", "Au milieu du pré"], "source": "FFE", "level": "g1"}, {"id": "club_03", "ch": "club", "title": "Le manège", "text": "Le manège est une aire de pratique couverte.", "q": "Comment appelle-t-on une aire de pratique couverte ?", "answer": "Le manège", "wrong": ["La carrière", "La sellerie"], "source": "FFE", "level": "g1"}, {"id": "club_04", "ch": "club", "title": "La carrière", "text": "La carrière est une aire extérieure aménagée pour pratiquer l’équitation.", "q": "Comment appelle-t-on l’aire de pratique extérieure ?", "answer": "La carrière", "wrong": ["Le manège couvert", "Le box"], "source": "FFE", "level": "g1"}, {"id": "club_05", "ch": "club", "title": "Le box", "text": "Le box est un logement individuel pour un cheval.", "q": "À quoi sert un box ?", "answer": "À loger un cheval", "wrong": ["À ranger seulement les selles", "À remplacer un casque"], "source": "FFE", "level": "g1"}, {"id": "club_06", "ch": "club", "title": "Le pré", "text": "Le pré est un espace extérieur enherbé. Sa gestion et ses clôtures sont assurées par les responsables.", "q": "Quel lieu est un espace enherbé ?", "answer": "Le pré", "wrong": ["La sellerie", "Le manège"], "source": "FFE", "level": "g1"}, {"id": "club_07", "ch": "club", "title": "L’aire de pansage", "text": "L’aire de pansage est un endroit prévu pour s’occuper des chevaux. On respecte les consignes d’attache.", "q": "Où s’occupe-t-on de sa monture selon les consignes du club ?", "answer": "Sur l’aire de pansage prévue", "wrong": ["En bloquant une porte", "Au milieu d’une reprise"], "source": "FFE", "level": "g1"}, {"id": "club_08", "ch": "club", "title": "La FFE", "text": "FFE signifie Fédération française d’équitation. Elle organise notamment les diplômes fédéraux appelés Galops.", "q": "Que signifie FFE ?", "answer": "Fédération française d’équitation", "wrong": ["Famille des filets et étriers", "Fête française des écuries"], "source": "GUIDE", "level": "g1"}, {"id": "club_09", "ch": "club", "title": "La licence", "text": "La licence fédérale te rattache à la fédération. Elle est généralement prise par l’intermédiaire du club.", "q": "La licence fédérale me rattache à…", "answer": "La Fédération française d’équitation", "wrong": ["Une seule selle", "Une robe de cheval"], "source": "GUIDE", "level": "g1"}, {"id": "club_10", "ch": "club", "title": "Le Galop 1", "text": "Le Galop 1 associe connaissances, soins, pratique à pied et pratique montée. Un quiz ne suffit pas à le valider.", "q": "Pour valider le Galop 1, suffit-il de réussir cette application ?", "answer": "Non, il y a aussi des compétences pratiques", "wrong": ["Oui, automatiquement", "Oui, sans enseignant"], "source": "FFE", "level": "g1"}, {"id": "club_11", "ch": "club", "title": "Les autres et l’environnement", "text": "La charte du cavalier demande de respecter les personnes, le matériel et la nature, et de limiter les déchets.", "q": "Quelle action respecte la charte ?", "answer": "Ranger et trier ses déchets", "wrong": ["Laisser le matériel dans la boue", "Gaspiller l’eau volontairement"], "source": "FFE", "level": "g1"}, {"id": "vocabulaire_01", "ch": "vocabulaire", "title": "La monture", "text": "La monture est le cheval ou le poney que monte un cavalier.", "q": "Que désigne « ta monture » ?", "answer": "Ton cheval ou ton poney", "wrong": ["Ton casque", "Ta tablette"], "source": "FFE", "level": "g1"}, {"id": "vocabulaire_02", "ch": "vocabulaire", "title": "Panser", "text": "Panser signifie effectuer les soins de pansage, notamment brosser la monture.", "q": "Que veut dire « panser » ?", "answer": "S’occuper du cheval par le pansage", "wrong": ["Penser dans sa tête seulement", "Faire galoper"], "source": "FFE", "level": "g1"}, {"id": "vocabulaire_03", "ch": "vocabulaire", "title": "Seller", "text": "Seller signifie mettre la selle. La réalisation du geste s’apprend au club.", "q": "Que veut dire « seller » ?", "answer": "Mettre la selle", "wrong": ["Enlever le licol", "Laver le mors"], "source": "FFE", "level": "g1"}, {"id": "vocabulaire_04", "ch": "vocabulaire", "title": "Sangler", "text": "Sangler signifie attacher et ajuster la sangle. Ressangler, c’est vérifier et ajuster à nouveau le sanglage selon les consignes.", "q": "Quelle pièce ajuste-t-on en sanglant ?", "answer": "La sangle", "wrong": ["La muserolle", "Le frontal"], "source": "FFE", "level": "g1"}, {"id": "vocabulaire_05", "ch": "vocabulaire", "title": "Mener en main", "text": "Mener en main signifie conduire sa monture en marchant à côté d’elle, et non en étant en selle.", "q": "Pour mener en main, le cavalier est…", "answer": "À pied près de sa monture", "wrong": ["Debout sur la selle", "Dans la sellerie seulement"], "source": "FFE", "level": "g1"}, {"id": "vocabulaire_06", "ch": "vocabulaire", "title": "Le montoir", "text": "Un montoir est un support permettant de se mettre en selle. Son utilisation se fait avec un cheval correctement placé.", "q": "À quoi sert un montoir ?", "answer": "À aider à monter en selle", "wrong": ["À donner à boire", "À nettoyer les sabots"], "source": "FFE", "level": "g1"}, {"id": "vocabulaire_07", "ch": "vocabulaire", "title": "Chausser les étriers", "text": "Chausser ses étriers signifie y placer ses pieds. Déchausser signifie en retirer les pieds.", "q": "Que signifie « déchausser les étriers » ?", "answer": "Retirer les pieds des étriers", "wrong": ["Enlever ses chaussures", "Décrocher la sangle"], "source": "FFE", "level": "g1"}, {"id": "vocabulaire_08", "ch": "vocabulaire", "title": "Ajuster les rênes", "text": "Ajuster les rênes signifie régler leur longueur dans les mains, pour établir un contact adapté. On apprend ce geste avec l’enseignant.", "q": "Que règle-t-on en ajustant ses rênes ?", "answer": "Leur longueur dans les mains", "wrong": ["La taille du casque", "La hauteur de la carrière"], "source": "GUIDE", "level": "g1"}, {"id": "vocabulaire_09", "ch": "vocabulaire", "title": "Le trot enlevé", "text": "Au trot enlevé, le cavalier alterne en rythme un temps assis et un temps soulevé. Cela s’apprend à cheval avec l’enseignant.", "q": "Au trot enlevé, le cavalier…", "answer": "Alterne assis et soulevé en rythme", "wrong": ["Reste toujours debout", "Saute au sol à chaque foulée"], "source": "FFE", "level": "g1"}, {"id": "vocabulaire_10", "ch": "vocabulaire", "title": "L’arrêt", "text": "À l’arrêt, la monture est immobile. Passer de l’arrêt au pas est une transition.", "q": "Une monture à l’arrêt est…", "answer": "Immobile", "wrong": ["Forcément au trot", "Forcément couchée"], "source": "FFE", "level": "g1"}, {"id": "pied_01", "ch": "pied", "title": "À côté de la monture", "text": "On apprend à se placer à côté de sa monture pour la mener. Le placement et la tenue du matériel sont vérifiés par l’enseignant.", "q": "Qui vérifie mon placement réel ?", "answer": "L’enseignant au club", "wrong": ["Le score de l’application", "La couleur du licol"], "source": "FFE", "level": "g1"}, {"id": "pied_02", "ch": "pied", "title": "Le parcours simple", "text": "Au Galop 1, on apprend à mener au pas sur un tracé simple et connu, avec des lignes droites et des courbes des deux côtés.", "q": "Quel tracé fait partie du Galop 1 à pied ?", "answer": "Lignes droites et courbes au pas", "wrong": ["Saut d’un grand obstacle", "Course au galop seul"], "source": "FFE", "level": "g1"}, {"id": "pied_03", "ch": "pied", "title": "S’arrêter en main", "text": "S’arrêter avec la monture en main est un objectif pratique. La réponse du cheval et la sécurité doivent être observées au club.", "q": "S’arrêter en main s’apprend…", "answer": "Avec la monture et l’enseignant", "wrong": ["Uniquement sur une image", "En lâchant le cheval"], "source": "FFE", "level": "g1"}, {"id": "pied_04", "ch": "pied", "title": "Garder son espace", "text": "On apprend à éloigner sa monture de soi sans violence. Si elle bouscule et que tu ne sais pas agir, demande de l’aide.", "q": "Si ma monture me bouscule, je…", "answer": "Demande de l’aide pour rétablir un espace sûr", "wrong": ["La frappe", "Me laisse coincer"], "source": "FFE", "level": "g1"}, {"id": "pied_05", "ch": "pied", "title": "Rejoindre le terrain", "text": "Amener sa monture en filet, en main, sur le terrain fait partie des compétences du Galop 1.", "q": "Comment rejoint-on le terrain dans cet objectif ?", "answer": "En menant la monture en main", "wrong": ["En la laissant partir seule", "En courant loin devant"], "source": "FFE", "level": "g1"}, {"id": "monte_01", "ch": "monte", "title": "Se mettre en selle", "text": "Le Galop 1 prévoit de se mettre en selle à l’aide d’un montoir. L’enseignant organise la situation.", "q": "Quel support aide à se mettre en selle ?", "answer": "Un montoir", "wrong": ["Une mangeoire", "Une clôture"], "source": "FFE", "level": "g1"}, {"id": "monte_02", "ch": "monte", "title": "Ressangler", "text": "Au Galop 1, ressangler en selle peut se faire avec une aide. Demander de l’aide est normal.", "q": "Puis-je recevoir de l’aide pour ressangler au Galop 1 ?", "answer": "Oui", "wrong": ["Non, jamais", "Seulement sans enseignant"], "source": "FFE", "level": "g1"}, {"id": "monte_03", "ch": "monte", "title": "Les rênes", "text": "On apprend à prendre, ajuster, allonger, lâcher et reprendre les rênes selon les consignes.", "q": "Les rênes doivent être manipulées…", "answer": "Avec contrôle, selon les consignes", "wrong": ["En tirant toujours fort", "Sans regarder l’environnement"], "source": "FFE", "level": "g1"}, {"id": "monte_04", "ch": "monte", "title": "Les étriers au pas", "text": "Chausser et déchausser ses étriers au pas fait partie du programme pratique.", "q": "À quelle allure le programme G1 prévoit-il ce travail des étriers ?", "answer": "Au pas", "wrong": ["Uniquement au galop", "Seulement au saut"], "source": "FFE", "level": "g1"}, {"id": "monte_05", "ch": "monte", "title": "Posture au pas", "text": "L’objectif est d’être assis dans une bonne posture au pas, en cherchant équilibre et décontraction sous la conduite de l’enseignant.", "q": "Une bonne posture se travaille…", "answer": "Avec les corrections de l’enseignant", "wrong": ["En se crispant le plus possible", "En se tenant toujours aux rênes"], "source": "FFE", "level": "g1"}, {"id": "monte_06", "ch": "monte", "title": "Équilibre sur les étriers", "text": "Le Galop 1 comprend quelques foulées en équilibre sur les étriers au pas et au trot.", "q": "À quelles allures travaille-t-on cet équilibre au G1 ?", "answer": "Au pas et au trot", "wrong": ["Seulement à l’arrêt", "Seulement en sautant"], "source": "FFE", "level": "g1"}, {"id": "monte_07", "ch": "monte", "title": "Diriger et s’arrêter", "text": "Diriger au pas et effectuer des transitions simples entre arrêt, pas et trot sont des objectifs du Galop 1.", "q": "Quel enchaînement correspond à ces transitions ?", "answer": "Arrêt, pas, trot", "wrong": ["Sellerie, box, pré", "Noir, bai, alezan"], "source": "FFE", "level": "g1"}, {"id": "monte_08", "ch": "monte", "title": "Trotter enlevé", "text": "Au Galop 1, on cherche à trotter enlevé en rythme sur un tracé simple.", "q": "Quel objectif correspond au trot du Galop 1 ?", "answer": "Trotter enlevé en rythme", "wrong": ["Sauter un très grand obstacle", "Galoper sans consigne"], "source": "FFE", "level": "g1"}, {"id": "monte_09", "ch": "monte", "title": "Quelques foulées de galop", "text": "Le programme comprend quelques foulées de galop. Elles sont organisées par l’enseignant et ne se tentent pas seule.", "q": "Qui organise les premières foulées de galop ?", "answer": "L’enseignant", "wrong": ["L’application toute seule", "Personne"], "source": "FFE", "level": "g1"}, {"id": "monte_10", "ch": "monte", "title": "Descendre", "text": "Descendre en autonomie est un objectif pratique. L’enseignant apprend le geste et choisit une situation sûre.", "q": "Réussir le quiz sur la descente suffit-il à maîtriser le geste ?", "answer": "Non, il faut le pratiquer et le faire vérifier", "wrong": ["Oui", "Oui, même sans cheval"], "source": "FFE", "level": "g1"}, {"id": "aliments_01", "ch": "aliments", "title": "L’herbe", "text": "L’herbe est un fourrage frais que le cheval peut pâturer.", "q": "Choisis l’image qui représente l’herbe.", "answer": "L’herbe", "wrong": ["Le foin", "La paille", "Les céréales"], "source": "FOOD", "level": "bonus", "visual": "food:grass"}, {"id": "aliments_02", "ch": "aliments", "title": "Le foin", "text": "Le foin est de l’herbe fauchée puis séchée pour être conservée.", "q": "Choisis l’image qui représente le foin.", "answer": "Le foin", "wrong": ["L’herbe", "La paille", "Les céréales"], "source": "FOOD", "level": "bonus", "visual": "food:hay"}, {"id": "aliments_03", "ch": "aliments", "title": "La paille", "text": "La paille est formée de tiges de céréales après récolte des grains. Elle sert souvent de litière et peut aussi entrer dans certaines rations.", "q": "Choisis l’image qui représente la paille.", "answer": "La paille", "wrong": ["L’herbe", "Le foin", "Les céréales"], "source": "FOOD", "level": "bonus", "visual": "food:straw"}, {"id": "aliments_04", "ch": "aliments", "title": "Les céréales", "text": "Les céréales sont des aliments en grains. Elles ne remplacent pas la base de fourrage.", "q": "Choisis l’image qui représente les céréales.", "answer": "Les céréales", "wrong": ["L’herbe", "Le foin", "La paille"], "source": "FOOD", "level": "bonus", "visual": "food:grain"}, {"id": "aliments_05", "ch": "aliments", "title": "Les granulés", "text": "Les granulés sont une forme de présentation des aliments. Leur composition dépend du produit : il faut lire l’étiquette.", "q": "Choisis l’image qui représente les granulés.", "answer": "Les granulés", "wrong": ["L’herbe", "Le foin", "La paille"], "source": "FOOD", "level": "bonus", "visual": "food:pellets"}, {"id": "aliments_06", "ch": "aliments", "title": "L’eau", "text": "Le cheval doit disposer d’eau propre et potable. Les besoins varient selon la chaleur, l’activité et l’alimentation.", "q": "Choisis l’image qui représente l’eau.", "answer": "L’eau", "wrong": ["L’herbe", "Le foin", "La paille"], "source": "FOOD", "level": "bonus", "visual": "food:water"}, {"id": "aliments_07", "ch": "aliments", "title": "La base de la ration", "text": "Les fourrages, comme l’herbe et le foin, forment la base de l’alimentation du cheval.", "q": "Quelle est la base de l’alimentation ?", "answer": "Les fourrages", "wrong": ["Les bonbons", "Uniquement les céréales"], "source": "FOOD", "level": "bonus"}, {"id": "aliments_08", "ch": "aliments", "title": "Les concentrés ne sont pas automatiques", "text": "Les concentrés complètent la ration lorsque cela est nécessaire. Tous les chevaux n’ont pas besoin des mêmes quantités ni des mêmes aliments.", "q": "Tous les poneys ont-ils besoin de la même ration de granulés ?", "answer": "Non, la ration est adaptée", "wrong": ["Oui, sans exception", "Oui, quelle que soit leur activité"], "source": "FOOD", "level": "bonus"}, {"id": "aliments_09", "ch": "aliments", "title": "Manger souvent", "text": "Le cheval consomme naturellement de petites quantités de végétaux pendant une grande partie de la journée.", "q": "Quel comportement alimentaire est naturel ?", "answer": "Manger souvent de petites quantités", "wrong": ["Un seul énorme repas par semaine", "Manger uniquement en cinq minutes"], "source": "FOOD", "level": "bonus"}, {"id": "aliments_10", "ch": "aliments", "title": "Distribuer avec autorisation", "text": "Les responsables adaptent l’alimentation à chaque cheval. Tu ne modifies pas la ration et tu ne donnes pas de friandises sans autorisation.", "q": "Qui décide de la ration ?", "answer": "Les responsables compétents du cheval", "wrong": ["L’enfant au hasard", "Le résultat d’un quiz"], "source": "FOOD", "level": "bonus"}, {"id": "membres_01", "ch": "membres", "title": "Le genou", "text": "Le genou est une articulation du membre antérieur, située au-dessus du canon.", "q": "Trouve le genou sur le schéma.", "answer": "Le genou", "wrong": ["Le jarret", "Le canon", "Le boulet"], "source": "FFE", "level": "bonus", "diagram": "limbs", "target": "genou"}, {"id": "membres_02", "ch": "membres", "title": "Le jarret", "text": "Le jarret est une articulation du membre postérieur, au-dessus du canon.", "q": "Trouve le jarret sur le schéma.", "answer": "Le jarret", "wrong": ["Le genou", "Le canon", "Le boulet"], "source": "FFE", "level": "bonus", "diagram": "limbs", "target": "jarret"}, {"id": "membres_03", "ch": "membres", "title": "Le canon", "text": "Le canon se trouve entre le genou ou le jarret et le boulet.", "q": "Trouve le canon sur le schéma.", "answer": "Le canon", "wrong": ["Le genou", "Le jarret", "Le boulet"], "source": "FFE", "level": "bonus", "diagram": "limbs", "target": "canon"}, {"id": "membres_04", "ch": "membres", "title": "Le boulet", "text": "Le boulet est l’articulation située au-dessous du canon, juste avant le pâturon.", "q": "Trouve le boulet sur le schéma.", "answer": "Le boulet", "wrong": ["Le genou", "Le jarret", "Le canon"], "source": "FFE", "level": "bonus", "diagram": "limbs", "target": "boulet"}, {"id": "membres_05", "ch": "membres", "title": "Le pâturon", "text": "Le pâturon se situe entre le boulet et la couronne.", "q": "Trouve le pâturon sur le schéma.", "answer": "Le pâturon", "wrong": ["Le genou", "Le jarret", "Le canon"], "source": "FFE", "level": "bonus", "diagram": "limbs", "target": "paturon"}, {"id": "membres_06", "ch": "membres", "title": "La couronne", "text": "La couronne est à la limite entre le pâturon et le sabot.", "q": "Trouve la couronne sur le schéma.", "answer": "La couronne", "wrong": ["Le genou", "Le jarret", "Le canon"], "source": "FFE", "level": "bonus", "diagram": "limbs", "target": "couronne"}, {"id": "membres_07", "ch": "membres", "title": "Le sabot", "text": "Le sabot termine le membre. Il doit être entretenu et surveillé.", "q": "Trouve le sabot sur le schéma.", "answer": "Le sabot", "wrong": ["Le genou", "Le jarret", "Le canon"], "source": "FFE", "level": "bonus", "diagram": "limbs", "target": "sabot"}, {"id": "decouvertes_01", "ch": "decouvertes", "title": "Les cinq sens", "text": "Le cheval utilise la vue, l’ouïe, l’odorat, le goût et le toucher.", "q": "Quelle liste correspond aux cinq sens ?", "answer": "Vue, ouïe, odorat, goût, toucher", "wrong": ["Pas, trot, galop, arrêt, saut", "Tête, queue, selle, pré, box"], "source": "COM", "level": "bonus"}, {"id": "decouvertes_02", "ch": "decouvertes", "title": "L’odorat", "text": "Le cheval utilise l’odorat pour explorer et reconnaître des individus.", "q": "Quel sens sert à analyser des odeurs ?", "answer": "L’odorat", "wrong": ["L’ouïe", "La vue"], "source": "COM", "level": "bonus"}, {"id": "decouvertes_03", "ch": "decouvertes", "title": "Le flehmen", "text": "Le flehmen, avec la lèvre supérieure retroussée, participe à l’analyse d’une odeur. Ce n’est pas simplement un sourire.", "q": "Le flehmen est associé à…", "answer": "L’analyse d’une odeur", "wrong": ["Un sourire humain", "Une allure"], "source": "COM", "level": "bonus"}, {"id": "decouvertes_04", "ch": "decouvertes", "title": "Le toilettage mutuel", "text": "Des chevaux peuvent se toiletter mutuellement. Ce comportement peut renforcer leurs liens sociaux.", "q": "Deux chevaux qui se toilettent mutuellement peuvent…", "answer": "Renforcer leurs liens", "wrong": ["Changer de robe", "Apprendre le nom de la selle"], "source": "COM", "level": "bonus"}, {"id": "decouvertes_05", "ch": "decouvertes", "title": "Le langage du corps", "text": "Les chevaux communiquent beaucoup par les postures et les mouvements du corps, pas seulement par les sons.", "q": "Leur communication repose-t-elle uniquement sur le hennissement ?", "answer": "Non, le langage corporel est important", "wrong": ["Oui, uniquement", "Ils ne communiquent jamais"], "source": "COM", "level": "bonus"}, {"id": "decouvertes_06", "ch": "decouvertes", "title": "Les sons et le contexte", "text": "Un souffle, un hennissement ou un ébrouement ne s’interprète pas toujours de la même façon. Observe la situation.", "q": "Pour comprendre un son du cheval, je…", "answer": "Regarde aussi la situation et sa posture", "wrong": ["Lui attribue toujours le même sentiment", "Ignore tout le reste"], "source": "COM", "level": "bonus"}, {"id": "robesplus_01", "ch": "robesplus", "title": "Gris", "text": "La robe grise présente un mélange de poils blancs et foncés et peut s’éclaircir avec l’âge. Elle ne se réduit pas à une couleur de peinture uniforme.", "q": "Quelle illustration représente une robe gris ?", "answer": "Gris", "wrong": ["Pie", "Tacheté"], "source": "FFE", "level": "bonus", "visual": "coat:gris"}, {"id": "robesplus_02", "ch": "robesplus", "title": "Pie", "text": "Une robe pie comporte de grandes plages blanches et colorées. La couleur des plages peut notamment être noire, alezane ou baie.", "q": "Quelle illustration représente une robe pie ?", "answer": "Pie", "wrong": ["Gris", "Tacheté"], "source": "FFE", "level": "bonus", "visual": "coat:pie"}, {"id": "robesplus_03", "ch": "robesplus", "title": "Tacheté", "text": "Une robe tachetée présente de petites taches. Pour cet exercice, on la distingue des grandes plages d’une robe pie.", "q": "Quelle illustration représente une robe tacheté ?", "answer": "Tacheté", "wrong": ["Gris", "Pie"], "source": "FFE", "level": "bonus", "visual": "coat:tachete"}, {"id": "robesplus_04", "ch": "robesplus", "title": "La liste", "text": "Une liste est une marque blanche allongée sur le devant de la tête. Elle ne désigne pas une race.", "q": "Où se trouve une liste ?", "answer": "Sur le devant de la tête", "wrong": ["Sur le ventre seulement", "Sur les étriers"], "source": "FFE", "level": "bonus"}, {"id": "robesplus_05", "ch": "robesplus", "title": "La balzane", "text": "Une balzane est une marque blanche à l’extrémité d’un membre, d’étendue variable.", "q": "Où se trouve une balzane ?", "answer": "Sur un membre", "wrong": ["Dans la crinière seulement", "Sur la selle"], "source": "FFE", "level": "bonus"}, {"id": "robesplus_06", "ch": "robesplus", "title": "L’en-tête", "text": "L’en-tête est une marque blanche sur le front, de forme et d’étendue variables.", "q": "Où se trouve un en-tête ?", "answer": "Sur le front", "wrong": ["Au bout de la queue", "Sous le tapis"], "source": "FFE", "level": "bonus"}, {"id": "outils_01", "ch": "outils", "title": "L’étrille", "text": "L’étrille décolle les saletés sur les zones adaptées. Il existe plusieurs modèles, pas un seul aspect.", "q": "Quel outil est l’étrille ?", "answer": "L’étrille", "wrong": ["Le bouchon", "La brosse douce", "Le cure-pied"], "source": "JARDY", "level": "bonus", "visual": "object:curry"}, {"id": "outils_02", "ch": "outils", "title": "Le bouchon", "text": "Le bouchon est une brosse à poils assez durs qui enlève les saletés décollées. On adapte la pression aux zones et au cheval.", "q": "Quel outil est le bouchon ?", "answer": "Le bouchon", "wrong": ["L’étrille", "La brosse douce", "Le cure-pied"], "source": "JARDY", "level": "bonus", "visual": "object:brush"}, {"id": "outils_03", "ch": "outils", "title": "La brosse douce", "text": "La brosse douce a des poils plus souples. Elle sert notamment à enlever la poussière fine.", "q": "Quel outil est la brosse douce ?", "answer": "La brosse douce", "wrong": ["L’étrille", "Le bouchon", "Le cure-pied"], "source": "JARDY", "level": "bonus", "visual": "object:softbrush"}, {"id": "outils_04", "ch": "outils", "title": "Le cure-pied", "text": "Le cure-pied sert à nettoyer le dessous du pied. Prendre et curer un pied sont des gestes à apprendre avec l’enseignant.", "q": "Quel outil est le cure-pied ?", "answer": "Le cure-pied", "wrong": ["L’étrille", "Le bouchon", "La brosse douce"], "source": "JARDY", "level": "bonus", "visual": "object:pick"}, {"id": "figures_01", "ch": "figures", "title": "Le cercle", "text": "Le cercle est un tracé rond qui revient à son point de départ.", "q": "Reconnais cette figure : le cercle.", "answer": "Le cercle", "wrong": ["La volte", "La diagonale", "Le doubler"], "source": "FFE", "level": "bonus", "visual": "figure:circle"}, {"id": "figures_02", "ch": "figures", "title": "La volte", "text": "La volte est un petit cercle. Les dimensions se choisissent selon l’exercice donné.", "q": "Reconnais cette figure : la volte.", "answer": "La volte", "wrong": ["Le cercle", "La diagonale", "Le doubler"], "source": "FFE", "level": "bonus", "visual": "figure:volte"}, {"id": "figures_03", "ch": "figures", "title": "La diagonale", "text": "La diagonale traverse la carrière en oblique, d’un côté vers l’autre.", "q": "Reconnais cette figure : la diagonale.", "answer": "La diagonale", "wrong": ["Le cercle", "La volte", "Le doubler"], "source": "FFE", "level": "bonus", "visual": "figure:diagonal"}, {"id": "figures_04", "ch": "figures", "title": "Le doubler", "text": "Un doubler traverse le manège ou la carrière par une ligne droite rejoignant le côté opposé.", "q": "Reconnais cette figure : le doubler.", "answer": "Le doubler", "wrong": ["Le cercle", "La volte", "La diagonale"], "source": "FFE", "level": "bonus", "visual": "figure:double"}, {"id": "figures_05", "ch": "figures", "title": "Le paddock", "text": "Le paddock est un espace extérieur de sortie ou de détente. Il n’est pas nécessairement un pré fournissant de l’herbe.", "q": "Un paddock est-il forcément un pré enherbé ?", "answer": "Non", "wrong": ["Oui, toujours", "C’est toujours une sellerie"], "source": "FFE", "level": "bonus"}, {"id": "figures_06", "ch": "figures", "title": "La stabulation", "text": "La stabulation peut accueillir plusieurs chevaux en logement collectif, avec un espace de déplacement.", "q": "Quel logement peut être collectif ?", "answer": "La stabulation", "wrong": ["Le casque", "Le siège de la selle"], "source": "FFE", "level": "bonus"}], "sources": {"FFE": {"title": "FFE — Programme officiel des Galops de cavalier, version 31 juillet 2012", "url": "https://www.ffe.com/system/files/cavalier/documents/pdf/PROGRAMME_OFFICIEL_GALOPS_CAVALIER_1a7_PAR_MODULE.pdf", "detail": "Galop 1 : pages 3–5 ; bonus Galop 2 : pages 6–7 ; Galop 3 : pages 8–9. Objectifs officiels, pas banque officielle de questions."}, "GUIDE": {"title": "FFE — Guide fédéral Galop 1, extraits publics", "url": "https://www.ffe.com/system/files/presse/guides-federaux/GALOP_1_GUIDE_FEDERAL_EXTRAITS.pdf", "detail": "Pages imprimées 16–19 : caractéristiques, corps, allures ; pages 48–49 : rênes et aides. Extraits seulement, non ouvrage complet."}, "JARDY": {"title": "Haras de Jardy — Support de théorie Galop 1", "url": "https://www.harasdejardy.com/images/Caro%20Site/2020/Galops/theorie-GALOP1_Jardy.pdf", "detail": "Support pédagogique de club, utilisé en complément du programme fédéral pour matériel, sécurité et pansage. Les schémas de cette application sont originaux."}, "COM": {"title": "IFCE — La communication chez le cheval", "url": "https://equipedia.ifce.fr/sante-et-bien-etre-animal/bien-etre-et-comportement-animal/comportement-du-cheval/la-communication-chez-le-cheval", "detail": "Lansade, Vidament, Roche, Neveux, 1 mars 2018. Observer l’ensemble des signes et le contexte."}, "FOOD": {"title": "IFCE — Bien nourrir son cheval", "url": "https://equipedia.ifce.fr/elevage-et-entretien/alimentation/nutrition-et-ration/bien-nourrir-son-cheval", "detail": "Doligez et Lamy, 9 septembre 2025. Fourrages, eau, concentrés et adaptation de la ration."}, "LONGE": {"title": "Centre équestre Dunois — Soins et conseils, sécurité", "url": "https://centreequestredunois.ffe.com/File/Toup_equestre_n7.pdf", "detail": "Support de club : ne pas enrouler la longe autour de sa main. Règle à mettre en pratique avec l’enseignant."}}, "skills": [{"id": "skill_1", "group": "Soins et manipulation", "text": "Observer le comportement de la monture"}, {"id": "skill_2", "group": "Soins et manipulation", "text": "S’occuper de la monture avant et après la séance"}, {"id": "skill_3", "group": "Soins et manipulation", "text": "Capter son attention au box et à l’attache"}, {"id": "skill_4", "group": "Soins et manipulation", "text": "L’aborder et changer de côté en sécurité"}, {"id": "skill_5", "group": "Soins et manipulat let prefs={auto:true,rate:.82,voice:'',stats:{},seen:{},skills:{},history:[]};try{const p=JSON.parse(localStorage.getItem('equiCompleteV1')||'null');if(p)prefs={...prefs,...p}}catch(e){}let token=0,timers=[],lastSpeech='',state=null,reviewIDs=[],currentChapter='',filter='g1',voices=[],audioCtx=null;
const byID=Object.fromEntries(DATA.cards.map(c=>[c.id,c])),chBy=Object.fromEntries(DATA.chapters.map(c=>[c.id,c]));

function stop(){token++;timers.forEach(clearTimeout);timers=[];if('speechSynthesis'in window)speechSynthesis.cancel()}
function say(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=prefs.rate;voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.voiceURI===prefs.voice)||voices.find(v=>v.lang.startsWith('fr')&&v.localService)||voices.find(v=>v.lang.startsWith('fr'))||null;speechSynthesis.speak(u)}
function guide(text){stop();lastSpeech=text;const t=token;if(prefs.auto)timers.push(setTimeout(()=>{if(token===t)say(text)},160))}
function listen(){return `<button class="small" onclick="say(lastSpeech)">${icon('sound')} Réécouter</button>`}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stats(id){return prefs.stats[id]||{n:0,ok:0,streak:0,last:0,lastOK:false,dates:[]}}
function label(id){let s=stats(id);if(!s.n)return 'Pas encore testé';if(!s.lastOK)return 'À revoir';if(s.dates.length>=3&&s.streak>=3)return 'Réussi à plusieurs dates';return 'Réussi récemment'}
function chapterProgress(ch){const a=DATA.cards.filter(c=>c.ch===ch);return {total:a.length,seen:a.filter(c=>prefs.seen[c.id]).length,ok:a.filter(c=>stats(c.id).lastOK).length}}
function leave(){if(state&&state.mode==='test'&&state.i<state.q.length)return confirm('Quitter le test ? Cette séance ne sera pas terminée. Les réponses déjà données restent dans le suivi.');return true}
function navHome(){if(leave())home()}

function home(){stop();state=null;const n=DATA.cards.length,g=DATA.cards.filter(c=>c.level==='g1').length;const totalOK=DATA.cards.filter(c=>stats(c.id).lastOK).length;$('app').innerHTML=`<section class="card glass"><span class="pill">${DATA.chapters.length} chapitres · ${n} notions</span><h1>Un petit pas.<br>Un grand Galop.</h1><p>Apprends, joue et retrouve les connaissances du cavalier.</p><div class="row">${listen()}<span class="muted">Version étendue · portrait</span></div></section><div class="modes">${[['learn','book','','J’apprends','Je choisis un chapitre.'],['practice','spark','peach','Je m’entraîne','Je réponds avec des corrections.'],['test','flag','lilac','Je me teste','Je fais un bilan sans indices.']].map(([m,ic,cl,t,d])=>`<button class="mode glass" onclick="${m==='test'?"testSetup()":"catalog('"+m+"')"}"><span class="badge ${cl}">${icon(ic)}</span><span><strong>${t}</strong><span class="desc">${d}</span></span></button>`).join('')}</div><section class="card glass"><div class="statgrid"><div class="stat"><strong>${g}</strong><span>notions parcours G1</span></div><div class="stat"><strong>${n-g}</strong><span>notions bonus</span></div><div class="stat"><strong>${totalOK}</strong><span>réussites récentes</span></div></div><p class="muted">Le parcours G1 développe les objectifs officiels : chaque détail n’est pas une exigence réglementaire distincte. Les bonus restent séparés.</p><button class="wide" onclick="weakPractice()">Réviser mes notions à revoir</button></section><div class="footerlinks"><button class="small" onclick="parent()">Progression et réglages</button><button class="small" onclick="sources()">Sources et limites</button><button class="small" onclick="skills()">Gestes à travailler au club</button></div><p class="bottomnote">Application indépendante et non officielle. Elle ne délivre aucun Galop.</p>`;guide('Bonjour ! Pour apprendre, appuie sur « J’apprends ». Pour jouer sans reprendre le cours, choisis « Je m’entraîne ». Pour faire un bilan, choisis « Je me teste ».')}
function catalog(mode='learn',f=filter){stop();state=null;filter=f;$('app').innerHTML=`<span class="eyebrow">${mode==='learn'?'J’apprends':'Je m’entraîne'}</span><h1>Choisis ton chapitre.</h1><div class="row">${listen()}<button class="small" onclick="home()">Accueil</button></div><div class="filter"><button class="small ${f==='g1'?'on':''}" onclick="catalog('${mode}','g1')">Parcours Galop 1</button><button class="small ${f==='bonus'?'on':''}" onclick="catalog('${mode}','bonus')">Découvertes bonus</button><button class="small" onclick="library()">Chercher une notion</button></div><div class="chapters">${DATA.chapters.filter(c=>c.level===f).map((c,i)=>{const s=chapterProgress(c.id);return `<button class="chapter glass" onclick="chapterPage('${c.id}','${mode}')"><span class="number">${icon(c.icon)}</span><span class="body"><strong>${esc(c.title)}</strong><small>${esc(c.subtitle)}</small><small>${s.total} notions · ${s.seen} vues · ${s.ok} réussites récentes</small></span><span aria-hidden="true">›</span></button>`}).join('')}</div>`;guide(`Choisis un chapitre en appuyant sur sa grande carte. ${f==='bonus'?'Tu es dans les découvertes bonus. Elles ne comptent pas dans le bilan Galop 1.':'Tu es dans le parcours Galop 1.'}`)}
function chapterPage(id,preferred='learn'){stop();state=null;currentChapter=id;const ch=chBy[id],cc=DATA.cards.filter(c=>c.ch===id);$('app').innerHTML=`<span class="pill ${ch.level==='bonus'?'bonus':''}">${ch.level==='bonus'?'Bonus · hors bilan G1':'Parcours Galop 1'}</span><h1>${esc(ch.title)}</h1><p>${esc(ch.subtitle)}</p><div class="row">${listen()}<button class="small" onclick="catalog('${preferred}')">Chapitres</button></div><div class="actions"><button class="primary" onclick="start('learn',['${id}'])">Découvrir les ${cc.length} notions</button><button onclick="start('practice',['${id}'])">M’entraîner directement</button><button onclick="testSetup(['${id}'])">Tester ce chapitre</button></div><section class="card glass"><h2>Accès direct aux petites leçons</h2><div class="chapters">${cc.map(c=>`<button class="chapter" onclick="startOne('${c.id}')"><span class="body"><strong>${esc(c.title)}</strong><small>${prefs.seen[c.id]?'Déjà vue · ':''}${label(c.id)}</small></span><span>›</span></button>`).join('')}</div></section>`;guide(`Voici le chapitre « ${ch.title} ». Pour commencer, appuie sur « Découvrir les ${cc.length} notions ». Tu peux aussi choisir directement une petite leçon, un entraînement ou un test.`)}

function buildQuestion(c,mode){const diagram=!!c.diagram,kind=diagram&&(mode==='test'||mode==='practice')&&Math.random()<.4?'name':diagram?'point':'mc';let options=shuffle([c.answer,...c.wrong.slice(0,3)]);return {c,kind,options,selected:null}}
function start(mode,ids,custom=null,count=null){stop();let pool=custom||DATA.cards.filter(c=>ids.includes(c.ch));if(!pool.length){alert('Aucune notion dans cette sélection.');return}let picked=mode==='learn'?[...pool]:shuffle(pool);if(count)picked=picked.slice(0,count);state={mode,q:picked.map(c=>buildQuestion(c,mode)),i:0,answers:[],phase:mode==='learn'?'discover':'answer',origin:ids,review:false};render()}
function weakPractice(){const now=Date.now();let pool=DATA.cards.filter(c=>c.level==='g1'&&stats(c.id).n&&(!stats(c.id).lastOK||now-stats(c.id).last>86400000));if(!pool.length)pool=DATA.cards.filter(c=>c.level==='g1'&&stats(c.id).n);if(!pool.length){catalog('practice');return}pool.sort((a,b)=>Number(stats(a.id).lastOK)-Number(stats(b.id).lastOK)||stats(a.id).last-stats(b.id).last);start('practice',[],pool.slice(0,12))}
function rhythm(key){const n={pas:4,trot:2,galop:3}[key];if(!n)return '<div class="pulses"><span class="pulse">1</span><span class="pulse">2</span><span class="pulse">3</span><span class="pulse">4</span></div>';return `<div class="pulses">${Array.from({length:n},(_,i)=>`<span class="pulse" data-beat="${i}">${i+1}</span>`).join('')}</div><button class="wide" onclick="playRhythm('${key}')">Écouter ce rythme</button><p class="hint">Rythme pédagogique synthétique, pas un enregistrement de sabots.</p>`}
function playRhythm(key){stop();const n={pas:4,trot:2,galop:3}[key];if(!n)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();for(let group=0;group<3;group++)for(let j=0;j<n;j++){const delay=group*(n*370+430)+j*370;timers.push(setTimeout(()=>{document.querySelectorAll('.pulse').forEach(e=>e.classList.toggle('beat',Number(e.dataset.beat)===j));const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=240;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.13,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.11);o.start();o.stop(audioCtx.currentTime+.12)},delay))}timers.push(setTimeout(()=>document.querySelectorAll('.pulse').forEach(e=>e.classList.remove('beat')),3*(n*370+430)))}catch(e){alert('Le son rythmique n’est pas disponible dans ce navigateur.')}}

function visualForOption(c,opt){if(!c.visual)return null;const type=c.visual.split(':')[0];const maps={coat:{Noir:'noir',Alezan:'alezan',Bai:'bai',Gris:'gris',Pie:'pie',Tacheté:'tachete'},food:{'L’herbe':'grass','Le foin':'hay','La paille':'straw','Les céréales':'grain','Les granulés':'pellets','L’eau':'water'},object:{'L’étrille':'curry','Le bouchon':'brush','La brosse douce':'softbrush','Le cure-pied':'pick'},figure:{'Le cercle':'circle','La volte':'volte','La diagonale':'diagonal','Le doubler':'double'}};return maps[type]?.[opt]?type+':'+maps[type][opt]:null}
